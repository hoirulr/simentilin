## Konfigurasi Nginx untuk SI-MENTILIN di Linuxserver Nginx
## Lokasi file pada server CasaOS:
## /DATA/AppData/nginx/config/nginx/site-confs/default.conf
## (atau /DATA/AppData/nginx/config/nginx/site-confs/simentilin.conf)

server {
    listen 80 default_server;
    listen [::]:80 default_server;

    server_name _;

    # Root menunjuk ke direktori public SI-MENTILIN di dalam container
    root /config/www/simentilin/public;
    index index.php index.html index.htm;

    client_max_body_size 50M;

    # Routing Laravel (Livewire & SPA support)
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Penanganan PHP via php-fpm bawaan linuxserver/nginx
    location ~ \.php$ {
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        include /etc/nginx/fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTP_PROXY "";
        fastcgi_read_timeout 300;
    }

    # Blokir akses ke file sensitif (.env, .git, dll)
    location ~ /\.(?!well-known).* {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Blokir akses langsung ke storage internal jika ada
    location ~ ^/(storage/logs|database) {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Optimasi cache aset statis (Vite build assets)
    location ~* \.(jpg|jpeg|gif|png|css|js|ico|xml|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        access_log off;
        add_header Cache-Control "public, no-transform";
    }

    # Favicon dan robots
    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }
}
