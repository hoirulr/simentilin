services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: simentilin:latest
    container_name: simentilin-app
    restart: unless-stopped
    ports:
      - "8088:80"
    env_file:
      - .env
    environment:
      - APP_ENV=production
      - DB_HOST=db
      - DB_CONNECTION=mariadb
      - DB_PORT=3306
    depends_on:
      - db
    volumes:
      - simentilin_storage:/var/www/html/storage
    networks:
      - simentilin-net
    x-casaos:
      envs:
        - container: APP_URL
          description:
            en_us: Web URL
        - container: DB_PASSWORD
          description:
            en_us: Database Password
      ports:
        - container: "80"
          description:
            en_us: Web HTTP Port

  db:
    image: mariadb:10.11
    container_name: simentilin-db
    restart: unless-stopped
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: root_secret_pass
      MYSQL_DATABASE: simentilin
      MYSQL_USER: simentilin
      MYSQL_PASSWORD: simentilin_secret_pass
    volumes:
      - simentilin_db:/var/lib/mysql
    networks:
      - simentilin-net

volumes:
  simentilin_storage:
    driver: local
  simentilin_db:
    driver: local

networks:
  simentilin-net:
    driver: bridge

x-casaos:
  architectures:
    - amd64
    - arm64
  main: app
  description:
    en_us: Sistem Informasi Manajemen & Tindak Lanjut Layanan KB DP2KBP3A Kabupaten Bangka
  tagline:
    en_us: SI-MENTILIN KB Bangka
  developer: DP2KBP3A Kabupaten Bangka
  author: hoirulr
  icon: https://raw.githubusercontent.com/hoirulr/simentilin/main/public/favicon.svg
  thumbnail: ""
  title:
    en_us: SI-MENTILIN
  index: /
  port_map: "8088"
